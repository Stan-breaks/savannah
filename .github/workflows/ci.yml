name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # database/ is generated by sqlc, so it has to match the queries.
      - name: Check that the generated code is current
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin sqlc
          sqlc generate
          git diff --exit-code -- database/ sqlc/

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
